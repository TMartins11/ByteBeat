<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteBeat </title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%2300f2fe' d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #06070a;
            --bg-gradient: radial-gradient(circle at 50% 35%, rgba(127, 0, 255, 0.15) 0%, rgba(0, 242, 254, 0.05) 45%, rgba(6, 7, 10, 0) 75%);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-cyan: #00f2fe;
            --accent-purple: #7f00ff;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Header e Logo Ampliada */
        header {
            width: 100%;
            padding: 3.5rem 2rem 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-cyan) 70%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 1.1rem;
            transition: transform 0.3s ease;
        }

        .brand-logo:hover {
            transform: scale(1.03);
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .brand-icon svg {
            fill: url(#brand-grad);
        }

        /* Hero Section Premium */
        .hero-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem 4rem 1.5rem;
            max-width: 840px;
            margin: auto 0;
            animation: heroFade 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes heroFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tagline {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 0.5rem 1.3rem;
            border-radius: 30px;
            margin-bottom: 2.5rem;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }

        .hero-title {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.04em;
            margin-bottom: 1.5rem;
            background: linear-gradient(180deg, #ffffff 50%, rgba(255, 255, 255, 0.6) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.8;
            max-width: 600px;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            gap: 0.85rem;
            background: #ffffff;
            color: #06070a;
            padding: 1.1rem 2.8rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.12);
        }

        .btn-enter:hover {
            transform: translateY(-3px);
            background: #ffffff;
            box-shadow: 0 15px 40px rgba(0, 242, 254, 0.25);
        }

        .btn-enter svg {
            transition: transform 0.3s ease;
        }

        .btn-enter:hover svg {
            transform: translateX(4px);
        }

        /* Footer com API Docs abaixo do copyright */
        footer {
            padding: 3rem 1.5rem 2.5rem 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
        }

        .footer-docs {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            transition: color 0.3s ease;
            opacity: 0.7;
        }

        .footer-docs:hover {
            color: var(--accent-cyan);
            opacity: 1;
        }
    </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute;">
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="50%" stop-color="#00f2fe" />
        <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
</svg>

<header>
    <a href="#" class="brand-logo">
        <div class="brand-icon">
            <svg width="28" height="28" viewBox="0 0 24 24">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
        </div>
        ByteBeat
    </a>
</header>

<main class="hero-container">
    <div class="tagline"><span>✦</span> Acervo & Comunidade</div>
    <h1 class="hero-title">Sua biblioteca musical. Redefinida.</h1>
    <p class="hero-subtitle">Organize suas faixas favoritas, construa seu diário musical e descubra recomendações personalizadas da comunidade.</p>

    <a href="app.html" class="btn-enter">
        Acessar Plataforma
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
    </a>
</main>

<footer>
    <p>ByteBeat &copy; 2026 — Thiago Martins</p>
    <a href="/swagger-ui/index.html" target="_blank" class="footer-docs">Documentação da API (Swagger)</a>
</footer>

</body>
</html>
